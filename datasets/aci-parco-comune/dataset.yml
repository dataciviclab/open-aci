root: "../../out"
schema_version: 1

dataset:
  name: "aci_parco_comune"
  source_id: "aci"
  tags: [trasporti, aci, parco-veicolare, comuni, autovetture, motocicli, autocarri, autoritratto]
  category: trasporti
  description: "Parco veicolare per comune e categoria (stock al 31/12), 2024-2025. Fonte ACI Autoritratto, open data. ATTENZIONE: veicoli registrati al domicilio dell'intestatario, non circolanti nel comune."
  years: [2024, 2025]
  time_coverage:
    mode: "full_series"
    start_year: 2024
    end_year: 2025

raw:
  output_policy: overwrite
  extractor:
    type: "unzip_all"
  sources:
    - name: "autoritratto_2024"
      type: "http_file"
      year: 2024
      primary: true
      args:
        url: "https://aci.gov.it//app/uploads/2025/06/Autoritratto-2024-Parco-Veicolare.zip"
        filename: "aci_parco_comune_2024.zip"
    - name: "autoritratto_2025"
      type: "http_file"
      year: 2025
      args:
        url: "https://aci.gov.it//app/uploads/2026/06/Autoritratto2025_Parco_veicolare.zip"
        filename: "aci_parco_comune_2025.zip"

support:
  # Snapshot ISTAT fissa 2026 — URI senza {year} (altrimenti toolkit usa l'anno del run)
  - name: "istat_comuni"
    type: "external"
    uri: "https://storage.googleapis.com/dataciviclab-clean/istat_elenco_comuni/2026/istat_elenco_comuni_2026_clean.parquet"
    years: [2026]

clean:
  sql: "sql/clean.sql"
  required_columns:
    - anno
    - regione
    - provincia
    - comune
    - categoria_veicolo
    - veicoli
  read:
    source: config_only
    mode: explicit
    include: ["Parco_veicolare_*.xlsx"]
    sheet_name: "45 Comune categoria"
    header: true
    skip: 2
    trim_whitespace: true
  validate:
    not_null: [anno, regione, provincia, comune, categoria_veicolo]
    min_rows: 50000
    primary_key: [anno, regione, provincia, comune, categoria_veicolo]

mart:
  tables:
    - name: "mart_comune_categoria"
      sql: "sql/mart_comune_categoria.sql"
    - name: "mart_auto_per_1000"
      sql: "sql/mart_auto_per_1000.sql"
    - name: "mart_provincia"
      sql: "sql/mart_provincia.sql"
  required_tables:
    - "mart_comune_categoria"
    - "mart_auto_per_1000"
    - "mart_provincia"
  validate:
    table_rules:
      mart_comune_categoria:
        required_columns: [anno, regione, provincia, comune, categoria_veicolo, veicoli]
        min_rows: 50000
        primary_key: [anno, regione, provincia, comune, categoria_veicolo]
      mart_auto_per_1000:
        required_columns: [anno, comune, autovetture, popolazione_residente, auto_per_1000]
        min_rows: 5000
        primary_key: [anno, regione, provincia, comune]
      mart_provincia:
        required_columns: [anno, regione, provincia, autovetture, veicoli_totali, comuni]
        min_rows: 90
        primary_key: [anno, regione, provincia]

validation:
  fail_on_error: true

registry:
  theme: "Parco veicolare per comune e categoria"
  nuts_level: 3
  dimensions: ["comune", "categoria_veicolo"]
  description: "ACI Autoritratto — foglio 45, stock al 31/12 per comune e categoria veicolo"

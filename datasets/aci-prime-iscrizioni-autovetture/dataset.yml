root: "../../out"
schema_version: 1

dataset:
  name: "aci_prime_iscrizioni_autovetture"
  source_id: "aci"
  tags: [trasporti, aci, prime-iscrizioni, autovetture, alimentazione, parco-auto]
  category: trasporti
  description: "Prime iscrizioni di autovetture nuove in Italia per comune e tipo di alimentazione (2017-2025). Fonte ACI via dati.gov.it / lod.aci.it."
  years: [2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
  time_coverage:
    mode: "full_series"
    start_year: 2017
    end_year: 2025

raw:
  output_policy: overwrite
  sources:
    - name: "aci_prime_2017"
      type: "http_file"
      year: 2017
      primary: true
      args:
        url: "http://lod.aci.it/sites/default/files/Prime_iscrizioni_veicoli_nuovi_nel_2017-autovetture_per_ente_territoriale_e_alimentazione_1.csv"
        filename: "aci_prime_iscrizioni_2017.csv"
    - name: "aci_prime_2018"
      type: "http_file"
      year: 2018
      args:
        url: "http://lod.aci.it/sites/default/files/Prime_iscrizioni_veicoli_nuovi_nel_2018-autovetture_per_ente_territoriale_e_alimentazione%20.csv"
        filename: "aci_prime_iscrizioni_2018.csv"
    - name: "aci_prime_2019"
      type: "http_file"
      year: 2019
      args:
        url: "http://lod.aci.it/sites/default/files/Prime%20iscrizioni%20veicoli%20nuovi%20nel%202019%20-%20autovetture%20per%20ente%20territoriale%20e%20alimentazione.csv"
        filename: "aci_prime_iscrizioni_2019.csv"
    - name: "aci_prime_2020"
      type: "http_file"
      year: 2020
      args:
        url: "http://lod.aci.it/sites/default/files/Prime%20iscrizioni%20veicoli%20nuovi%20nel%202020%20%E2%80%93%20autovetture%20per%20ente%20territoriale%20e%20alimentazione.csv"
        filename: "aci_prime_iscrizioni_2020.csv"
    - name: "aci_prime_2021"
      type: "http_file"
      year: 2021
      args:
        url: "http://lod.aci.it/sites/default/files/Prime%20iscrizioni%20veicoli%20nuovi%20nel%202021%20%E2%80%93%20autovetture%20per%20ente%20territoriale%20e%20alimentazione.csv"
        filename: "aci_prime_iscrizioni_2021.csv"
    - name: "aci_prime_2022"
      type: "http_file"
      year: 2022
      args:
        url: "http://lod.aci.it/sites/default/files/Prime%20iscrizioni%20veicoli%20nuovi%20nel%202022%20%E2%80%93%20autovetture%20per%20ente%20territoriale%20e%20alimentazione.csv"
        filename: "aci_prime_iscrizioni_2022.csv"
    - name: "aci_prime_2023"
      type: "http_file"
      year: 2023
      args:
        url: "http://lod.aci.it/sites/default/files/Prime%20iscrizioni%20veicoli%20nuovi%20nel%202023%20%E2%80%93%20autovetture%20per%20ente%20territoriale%20e%20alimentazione.csv"
        filename: "aci_prime_iscrizioni_2023.csv"
    - name: "aci_prime_2024"
      type: "http_file"
      year: 2024
      args:
        url: "http://lod.aci.it/sites/default/files/statistiche_prime_iscrizioni_2024.csv"
        filename: "aci_prime_iscrizioni_2024.csv"
    - name: "aci_prime_2025"
      type: "http_file"
      year: 2025
      args:
        url: "http://lod.aci.it/sites/default/files/statistiche_prime_iscrizioni_2025.csv"
        filename: "aci_prime_iscrizioni_2025.csv"

clean:
  sql: "sql/clean.sql"
  required_columns:
    - anno
    - comune
    - provincia
    - codice_istat
    - regione
    - popolazione_residente
    - alimentazione
    - prime_iscrizioni
  read:
    source: config_only
    mode: all
    header: true
    delim: ","
    encoding: "utf-8"
    trim_whitespace: true
  validate:
    not_null: [anno, comune, alimentazione, prime_iscrizioni]
    min_rows: 1000
    primary_key: [anno, comune, provincia, alimentazione]

mart:
  tables:
    - name: "mart_anno_alimentazione"
      sql: "sql/mart_anno_alimentazione.sql"
      years: [2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
      source_layer: clean
    - name: "mart_regione_alimentazione"
      sql: "sql/mart_regione_alimentazione.sql"
      years: [2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
      source_layer: clean
    - name: "mart_quota_alimentazione"
      sql: "sql/mart_quota_alimentazione.sql"
      years: [2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
      source_layer: clean
  required_tables:
    - mart_anno_alimentazione
    - mart_regione_alimentazione
    - mart_quota_alimentazione
  validate:
    table_rules:
      mart_anno_alimentazione:
        required_columns: [anno, alimentazione, prime_iscrizioni, n_comuni]
        primary_key: [anno, alimentazione]
        not_null: [anno, alimentazione, prime_iscrizioni]
        min_rows: 10
      mart_regione_alimentazione:
        required_columns: [anno, regione, alimentazione, prime_iscrizioni]
        primary_key: [anno, regione, alimentazione]
        not_null: [anno, regione, alimentazione]
        min_rows: 50
      mart_quota_alimentazione:
        required_columns: [anno, alimentazione, prime_iscrizioni, quota_totale]
        primary_key: [anno, alimentazione]
        not_null: [anno, alimentazione, prime_iscrizioni, quota_totale]
        min_rows: 10

validation:
  fail_on_error: true

support:
  # Snapshot ISTAT fissa 2026 — URI senza {year} (altrimenti toolkit usa l'anno del run)
  - name: "istat_comuni"
    type: "external"
    uri: "https://storage.googleapis.com/dataciviclab-clean/istat_elenco_comuni/2026/istat_elenco_comuni_2026_clean.parquet"
    years: [2026]

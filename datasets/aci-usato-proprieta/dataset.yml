root: "../../out"
schema_version: 1

dataset:
  name: "aci_usato_proprieta"
  source_id: "aci"
  tags: [trasporti, aci, autoritratto, usato, passaggi-proprieta, minivolture]
  category: trasporti
  description: "Autoritratto ACI — passaggi di proprietà (mercato usato) per categoria veicolo, con split minivolture, 2024-2025. Fonte aci.gov.it open data."
  years: [2024, 2025]
  time_coverage:
    mode: "full_series"
    start_year: 2024
    end_year: 2025
    # 2019-2023: layout non omogeneo / formati misti — backlog

raw:
  output_policy: overwrite
  sources:
    - name: "aci_usato_2024"
      type: "http_file"
      year: 2024
      primary: true
      args:
        url: "https://aci.gov.it//app/uploads/2025/06/Autoritratto-2024-Usato.xlsx"
        filename: "aci_usato_proprieta_2024.xlsx"
    - name: "aci_usato_2025"
      type: "http_file"
      year: 2025
      args:
        url: "https://aci.gov.it//app/uploads/2026/06/Autoritratto2025_-Usato.xlsx"
        filename: "aci_usato_proprieta_2025.xlsx"

clean:
  sql: "sql/clean.sql"
  required_columns:
    - anno_riferimento
    - categoria
    - minivolture
    - non_minivolture
    - totale
  read:
    source: config_only
    mode: explicit
    include: ["aci_usato_proprieta_*.xlsx"]
    sheet_name: "1"
    header: true
    skip: 2
    trim_whitespace: true
  validate:
    not_null: [anno_riferimento, categoria, totale]
    min_rows: 3
    primary_key: [anno_riferimento, categoria]

mart:
  tables:
    - name: "mart_usato_categoria"
      sql: "sql/mart_usato_categoria.sql"
      years: [2024, 2025]
      source_layer: clean
    - name: "mart_usato_sintesi"
      sql: "sql/mart_usato_sintesi.sql"
      years: [2024, 2025]
      source_layer: clean
  required_tables:
    - mart_usato_categoria
    - mart_usato_sintesi
  validate:
    table_rules:
      mart_usato_categoria:
        required_columns: [anno_riferimento, categoria, minivolture, non_minivolture, totale]
        primary_key: [anno_riferimento, categoria]
        not_null: [anno_riferimento, categoria, totale]
        min_rows: 3
      mart_usato_sintesi:
        required_columns: [anno_riferimento, totale_usato, totale_av, quote_minivolture_av]
        primary_key: [anno_riferimento]
        not_null: [anno_riferimento, totale_usato, totale_av]
        min_rows: 1

validation:
  fail_on_error: true

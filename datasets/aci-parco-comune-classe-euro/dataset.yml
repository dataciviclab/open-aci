root: "../../out"
schema_version: 1

dataset:
  name: "aci_parco_comune_classe_euro"
  source_id: "aci"
  tags: [trasporti, aci, parco-veicolare, classe-euro, emissioni, comuni, autoritratto]
  category: trasporti
  description: "Autovetture per comune e classe ambientale Euro (stock al 31/12), 2024-2025. Fonte ACI Autoritratto, open data. ATTENZIONE: veicoli registrati al domicilio dell'intestatario, non circolanti nel comune."
  years: [2024, 2025]
  time_coverage:
    mode: "full_series"
    start_year: 2024
    end_year: 2025

raw:
  output_policy: overwrite
  extractor:
    type: "unzip_all"
  sources:
    - name: "autoritratto_2024"
      type: "http_file"
      year: 2024
      primary: true
      args:
        url: "https://aci.gov.it//app/uploads/2025/06/Autoritratto-2024-Parco-Veicolare.zip"
        filename: "aci_parco_euro_2024.zip"
    - name: "autoritratto_2025"
      type: "http_file"
      year: 2025
      args:
        url: "https://aci.gov.it//app/uploads/2026/06/Autoritratto2025_Parco_veicolare.zip"
        filename: "aci_parco_euro_2025.zip"

support:
  - name: "istat_comuni"
    type: "external"
    uri: "https://storage.googleapis.com/dataciviclab-clean/istat_elenco_comuni/2026/istat_elenco_comuni_2026_clean.parquet"
    years: [2026]

clean:
  sql: "sql/clean.sql"
  required_columns:
    - anno
    - regione
    - provincia
    - comune
    - classe_euro
    - autovetture
  read:
    source: config_only
    mode: explicit
    include: ["Circolante_Copert_*.xlsx"]
    # Il foglio si chiama esattamente "4 AV per Comune " (spazio finale) e il
    # toolkit normalizza strip() sul nome: per nome non è indirizzabile.
    # Si usa l'indice 4 (0-based), stabile nelle edizioni 2024 e 2025 (24 fogli,
    # stesso ordine). Se ACI cambia l'ordine, il run fallisce con "not found":
    # meglio un errore esplicito di un foglio sbagliato letto in silenzio.
    sheet_name: 4
    header: true
    skip: 2
    trim_whitespace: true
  validate:
    not_null: [anno, regione, provincia, comune, classe_euro]
    min_rows: 20000
    primary_key: [anno, regione, provincia, comune, classe_euro]

mart:
  tables:
    - name: "mart_comune_euro"
      sql: "sql/mart_comune_euro.sql"
  required_tables:
    - "mart_comune_euro"
  validate:
    table_rules:
      mart_comune_euro:
        required_columns: [anno, comune, classe_euro, autovetture, quota_pct]
        min_rows: 20000
        primary_key: [anno, regione, provincia, comune, classe_euro]

validation:
  fail_on_error: true

registry:
  theme: "Autovetture per comune e classe ambientale Euro"
  nuts_level: 3
  dimensions: ["comune", "classe_euro"]
  description: "ACI Autoritratto — foglio 4 AV per Comune, autovetture per classe Euro al 31/12"

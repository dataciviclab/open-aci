root: "../../out"
schema_version: 1

dataset:
  name: "aci_parco_provincia_soggetto"
  source_id: "aci"
  tags: [trasporti, aci, parco-veicolare, provincia, flotte, noleggio, leasing, famiglie]
  category: trasporti
  description: "Autovetture per provincia distinte tra persona fisica e persona giuridica (stock al 31/12), 2024-2025, con quota aziendale e auto per 1000 abitanti corretta. Fonte ACI Autoritratto."
  years: [2024, 2025]
  time_coverage:
    mode: "full_series"
    start_year: 2024
    end_year: 2025

raw:
  output_policy: overwrite
  extractor:
    type: "unzip_all"
  sources:
    - name: "autoritratto_2024"
      type: "http_file"
      year: 2024
      primary: true
      args:
        url: "https://aci.gov.it//app/uploads/2025/06/Autoritratto-2024-Parco-Veicolare.zip"
        filename: "aci_parco_soggetto_2024.zip"
    - name: "autoritratto_2025"
      type: "http_file"
      year: 2025
      args:
        url: "https://aci.gov.it//app/uploads/2026/06/Autoritratto2025_Parco_veicolare.zip"
        filename: "aci_parco_soggetto_2025.zip"

support:
  - name: "istat_comuni"
    type: "external"
    uri: "https://storage.googleapis.com/dataciviclab-clean/istat_elenco_comuni/2026/istat_elenco_comuni_2026_clean.parquet"
    years: [2026]

clean:
  sql: "sql/clean.sql"
  required_columns:
    - anno
    - regione
    - provincia
    - auto_persona_fisica
    - auto_persona_giuridica
    - auto_totali
  read:
    source: config_only
    mode: explicit
    include: ["Parco_veicolare_*.xlsx"]
    sheet_name: "30 AV Provincia soggetto"
    header: true
    skip: 2
    trim_whitespace: true
  validate:
    not_null: [anno, regione, provincia]
    min_rows: 90
    primary_key: [anno, regione, provincia]

mart:
  tables:
    - name: "mart_provincia_soggetto"
      sql: "sql/mart_provincia_soggetto.sql"
    - name: "mart_auto_per_1000_famiglie"
      sql: "sql/mart_auto_per_1000_famiglie.sql"
  required_tables:
    - "mart_provincia_soggetto"
    - "mart_auto_per_1000_famiglie"
  validate:
    table_rules:
      mart_provincia_soggetto:
        required_columns: [anno, regione, provincia, auto_persona_fisica, auto_persona_giuridica, auto_totali, quota_giuridica_pct]
        min_rows: 90
        primary_key: [anno, regione, provincia]
      mart_auto_per_1000_famiglie:
        required_columns: [anno, regione, provincia, auto_famiglie, popolazione_residente, famiglie_per_1000]
        min_rows: 90
        primary_key: [anno, regione, provincia]

validation:
  fail_on_error: true

registry:
  theme: "Parco autovetture per provincia e natura del proprietario"
  nuts_level: 3
  dimensions: ["provincia", "soggetto"]
  description: "ACI Autoritratto — foglio 30, autovetture persona fisica/giuridica per provincia"
